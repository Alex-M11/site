<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Демо-стіл</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #2c1e4a, #77216f 55%, #e95420); color: #fff; display: flex; flex-direction: column; }
    .top { background: rgba(0,0,0,.55); padding: .3rem .8rem; font-size: .85rem; display: flex; justify-content: space-between; }
    .desk { flex: 1; padding: 1.5rem; display: flex; gap: 1.5rem; align-items: flex-start; }
    .icon { width: 84px; text-align: center; font-size: .8rem; }
    .icon div { font-size: 38px; }
    .note { margin: auto; max-width: 520px; background: rgba(0,0,0,.45); padding: 1.2rem 1.4rem; border-radius: 12px; line-height: 1.5; }
    code { background: rgba(255,255,255,.15); padding: .05rem .3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="top"><span>Activities</span><span id="clock"></span><span>🔊 🔋</span></div>
  <div class="desk">
    <div class="icon"><div>📁</div>Мої_файли</div>
    <div class="icon"><div>🖥️</div>Термінал</div>
    <div class="icon"><div>🌐</div>Firefox</div>
    <div class="note">
      <strong>Демонстраційний режим (CD_DRIVER=fake)</strong><br>
      Портал працює без Docker, тому тут показано заглушку. На сервері з <code>CD_DRIVER=docker</code>
      у цьому вікні відкривається справжній робочий стіл KasmVNC з контейнера студента.
    </div>
  </div>
  <script>
    const tick = () => { document.getElementById("clock").textContent = new Date().toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" }); };
    tick(); setInterval(tick, 10000);
  </script>
</body>
</html>
